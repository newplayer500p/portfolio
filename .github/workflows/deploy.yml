name: Deploy React App to GitHub Pages

on:
  push:
    branches: ['main'] # Change en 'master' si ta branche principale s'appelle master

# Autorisations requises pour publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Annule les builds précédents si tu push plusieurs fois d'affilée
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout le code
        uses: actions/checkout@v4

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Utilise le cache npm pour accélérer le build

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le build React
        run: npm run build

      - name: Uploader l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Remplace par './build' si tu utilises Create React App

      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4